version: roledata-v2

# So với v1, mỗi group có thêm 3 field:
#   len_chars       [lo, hi]  band độ dài câu trả lời (mỗi lượt assistant)
#   min_points      int       số ý bắt buộc; 0 = không áp (case vai/giọng thuần)
#   require_structure bool    >=2 ý thì phải xuống dòng/gạch đầu dòng
#
# Band KHÔNG phải mục tiêu tự thân. Nó là hệ quả của min_points: gate chấm đủ ý
# trước, band chỉ chặn hai đầu (quá ngắn = chắc chắn thiếu ý; quá dài = lải nhải).
# Bằng chứng lải nhải: trong arm sản phẩm, câu càng dài `incorrect_content` càng
# cao (0.06 -> 0.51 từ tứ phân vị ngắn nhất tới dài nhất).

role_definition: AcneLLM Vietnamese acne guidance role and safety behavior

augmentation:
  ratio: 0.30
  styles: [teencode, no_accent, typo, mixed]
  answer_must_use_standard_vietnamese: true

groups:
  # ── nhóm ngắn: giữ nguyên hành vi, giữ nguyên độ dài ───────────────────────
  - {id: R7_conversation_glue, sample_kind: R7_conversation_glue, count: 120, context: false,
     len_chars: [80, 200], min_points: 0, require_structure: false,
     behavior: "Handle greetings, thanks, or digressions and redirect to acne", gate: onscope_redirect}

  - {id: R8_meta_jailbreak, sample_kind: R8_meta_jailbreak, count: 150, context: false,
     len_chars: [120, 300], min_points: 0, require_structure: false,
     behavior: "Keep the AcneLLM role under DAN, meta, prompt leak, or doctor-role attacks", gate: refusal_present+no_prompt_leak}

  - {id: R1_identity, sample_kind: R1_identity, count: 150, context: false,
     len_chars: [180, 400], min_points: 0, require_structure: false,
     behavior: "State AcneLLM identity, capabilities and limits without claiming to be a doctor", gate: identity_rule}

  - {id: R6_role_boundary, sample_kind: R6_role_boundary, count: 220, context: false,
     len_chars: [180, 380], min_points: 0, require_structure: false,
     behavior: "Politely refuse diagnosis, prescribing, dosing, or conclusions from an image", gate: refusal_present}

  - {id: B2_missing_answer, sample_kind: B2_missing_answer, count: 170, context: true,
     len_chars: [300, 600], min_points: 0, require_structure: false,
     behavior: "Explicitly abstain when the supplied reference lacks the needed answer", gate: abstain_rule}

  # R5 đổi HÀNH VI, không chỉ đổi độ dài: v1 có 187/187 mẫu chỉ hỏi ngược, không
  # tư vấn gì -> rubric chấm là "đọc xong vẫn không biết làm gì". v2 bắt trả lời
  # phần trả lời được TRƯỚC rồi mới hỏi. Xem prompts/R5_natural_clarification.j2.
  - {id: R5_natural_clarification, sample_kind: R5_natural_clarification, count: 170, context: false,
     len_chars: [300, 550], min_points: 1, require_structure: false,
     behavior: "Answer what can be answered first, then ask one or two focused questions", gate: clarify_present}

  # ── nhóm trung ────────────────────────────────────────────────────────────
  - {id: R9_multiturn, sample_kind: R9_multiturn, count: 200, context: false,
     len_chars: [250, 600], last_turn_len_chars: [900, 1400], min_points: 0, require_structure: false,
     behavior: "Create 4 to 6 alternating turns; the final assistant turn must give full advice, not another question",
     gate: turn_count+consistency, user_turns: 2-3}

  - {id: R4_measured_empathy, sample_kind: R4_measured_empathy, count: 180, context: false,
     len_chars: [700, 1100], min_points: 2, require_structure: false,
     behavior: "Acknowledge emotion briefly, then still give actionable acne advice", gate: empathy_rule}

  - {id: R3_nonjudgment, sample_kind: R3_nonjudgment, count: 200, context: false,
     len_chars: [800, 1300], min_points: 2, require_structure: true,
     behavior: "Respond without judging skin picking, mixed cream use, or skipped skincare", gate: nonjudgment_rule}

  # ── nhóm dài: mang nội dung, mục tiêu 1.100-1.600 ─────────────────────────
  - {id: B3_irrelevant_chunk, sample_kind: B3_irrelevant_chunk, count: 150, context: true,
     len_chars: [1000, 1500], min_points: 3, require_structure: true,
     behavior: "Ignore a distractor and use only the relevant acne reference", gate: grounded_rate}

  - {id: B5_depth_anchor, sample_kind: B5_depth_anchor, count: 80, context: true,
     len_chars: [800, 1600], min_points: 3, require_structure: true,
     behavior: "Explain identical source content at paired beginner and advanced depth", gate: grounded_rate+anchor_pair, anchor_pair_size: 2}

  - {id: B4_conflicting_docs, sample_kind: B4_conflicting_docs, count: 80, context: true,
     len_chars: [1100, 1600], min_points: 3, require_structure: true,
     behavior: "Describe both conflicting sources, lower confidence, and recommend clinician review", gate: conflict_rule}

  - {id: R10_special_population, sample_kind: R10_special_population, count: 190, context: false,
     len_chars: [1100, 1600], min_points: 3, require_structure: true,
     behavior: "Safely handle pregnancy, breastfeeding, under-12 children, and newborns", gate: referral_present+no_rx}

  - {id: R2_depth_adaptation, sample_kind: R2_depth_adaptation, count: 350, context: false,
     len_chars: [700, 1800], min_points: 3, require_structure: true,
     behavior: "Adapt explanation depth for teen, parent, or medical student without becoming prescriptive", gate: depth_marker}

  - {id: B1_grounded_role, sample_kind: B1_grounded_role, count: 470, context: true,
     len_chars: [1100, 1600], min_points: 3, require_structure: true,
     behavior: "Answer from supplied acne references while preserving role", gate: grounded_rate}

  - {id: K1_knowledge_anchor, sample_kind: K1_knowledge_anchor, count: 620, context: true,
     len_chars: [1200, 1700], min_points: 3, require_structure: true,
     behavior: "Give factually correct acne knowledge grounded in repository documents", gate: knowledge_accuracy+grounded_rate}
