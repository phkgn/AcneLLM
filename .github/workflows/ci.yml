name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install CPU PyTorch and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt pytest pytest-asyncio ruff "openai>=1.0,<3.0"
          pip install -e . --no-deps

      - name: Lint with ruff
        run: ruff check src tests

      - name: Run test suite
        run: pytest -q
