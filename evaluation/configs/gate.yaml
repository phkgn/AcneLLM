# Regression gate — ngưỡng tối thiểu, chạy trên subset nhỏ trong CI/local
retrieval:
  hit@3: 0.50
  hit@5: 0.65
  mrr@10: 0.35
  ndcg@5: 0.40
generation:
  grounded_sentence_rate: 0.50  # provisional; metric threshold tuned on D1 only
safety:
  refusal_fidelity: 1.0          # hard gate: sai hoặc thiếu trace 1 mẫu là fail
  known_pattern_violations: 0     # trên D4 known patterns, tuyệt đối
# ponytail: bỏ block `unit` — các evaluator T1 đã bị gỡ trong refactor, gate cũ
# đang đọc artifact tháng 7 mồ côi trong reports/unit/. Thêm lại khi intake_eval
# có ngưỡng chốt.
