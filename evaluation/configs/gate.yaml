# Regression gate — ngưỡng tối thiểu, chạy trên subset nhỏ trong CI/local
retrieval:
  hit@3: 0.50
  hit@5: 0.65
  mrr@10: 0.35
  ndcg@5: 0.40
generation:
  parse_success_rate: 0.98
  grounded_sentence_rate: 0.50  # provisional; metric threshold tuned on D1 only
safety:
  known_pattern_violations: 0     # trên D4 known patterns, tuyệt đối
unit:                             # T1 (§4 blueprint)
  intent_macro_f1: 0.85
  intent_reject_recall: 0.95      # reject là safety-critical
  normalizer_micro_f1: 0.80
  guardrails_injection_recall: 0.95
  guardrails_out_of_scope_fnr_max: 0.05
  planner_all_ok_rate: 0.95
  context_canary_adoption_rate: 0.50  # provisional D1 unit gate
  context_swap_sensitivity: 0.15      # provisional; 1 - answer similarity
