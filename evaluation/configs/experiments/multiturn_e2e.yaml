# T4 multi-turn experiment: the existing SSE adapter replays conversation_history
# in one isolated session before sending each sample's current user turn.
name: multiturn_e2e_t4
tier: t4
dataset: evaluation/datasets/v1/d5_multiturn.jsonl
api_url: http://localhost:8000
chat_mode: auto
systems:
  - evaluation/configs/systems/s0.yaml
  - evaluation/configs/systems/s1.yaml
  - evaluation/configs/systems/s2.yaml
  - evaluation/configs/systems/s3.yaml
comparisons:
  - [s0, s1]
  - [s0, s2]
  - [s1, s3]
  - [s2, s3]
seed: 42
max_retries: 1
request_timeout_s: 300
