# Tier T4 — end-to-end qua SSE API (backend phải chạy đúng model của từng condition).
# LƯU Ý: với t4, đổi model = đổi LLM_MODEL trong .env + restart backend giữa các condition;
# runner chạy TỪNG system một và dừng chờ xác nhận backend đúng model (kiểm tra /health).
name: main_e2e_t4
tier: t4
dataset: evaluation/datasets/v1/d2_test.jsonl
api_url: http://localhost:8000
chat_mode: auto
systems:
  - evaluation/configs/systems/s0.yaml
  - evaluation/configs/systems/s1.yaml
  - evaluation/configs/systems/s2.yaml
  - evaluation/configs/systems/s3.yaml
seed: 42
max_retries: 1
request_timeout_s: 300
