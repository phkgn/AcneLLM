# S3 — Finetuned LLM + RAG (production hiện tại)
id: s3
name: Model tinh chỉnh + RAG
adapter: ollama_batch
model: acne-generator
retrieval: true
template: route_prose
fallback_model: null
retrieve_top_k: 20
rerank_top_k: 5
use_mmr_prefilter: true
mmr_lambda: 0.6
sampling:
  temperature: 0.35
  top_p: 0.85
  top_k: 40
  repeat_penalty: 1.1
  num_ctx: 3072
  num_predict: 1200
  seed: 42
