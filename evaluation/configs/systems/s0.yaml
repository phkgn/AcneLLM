# S0 — Base LLM only (Qwen2.5-7B, Q4_K_M, CÙNG SYSTEM prompt với bản finetune — kiểm soát R1)
# Build model trước: python evaluation/scripts/make_base_modelfile.py && ollama create acne-generator-base -f evaluation/modelfiles/acne-generator-base/Modelfile
id: s0
name: Model gốc
adapter: ollama_batch          # T3 prose batch; T4 dùng SSE API qua experiment config
model: acne-generator-base
retrieval: false
template: route_prose
fallback_model: null           # BẮT BUỘC null khi eval (R4)
sampling:
  temperature: 0.35
  top_p: 0.85
  top_k: 40
  repeat_penalty: 1.1
  num_ctx: 3072
  num_predict: 1200
  seed: 42
