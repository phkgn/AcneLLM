# S2 — Base LLM + RAG (retrieval production: hybrid + RRF + MMR + rerank + filters)
id: s2
name: base_rag
adapter: ollama_batch
model: qwen25-base-acnesys
retrieval: true
template: route_prose
inline_citation: "off"
fallback_model: null
retrieve_top_k: 15
rerank_top_k: 5
use_mmr_prefilter: true
mmr_lambda: 0.6
sampling:
  temperature: 0.35
  top_p: 0.85
  top_k: 40
  repeat_penalty: 1.1
  num_ctx: 3072
  num_predict: 1200
  seed: 42
