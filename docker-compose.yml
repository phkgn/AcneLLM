name: acnellm

services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./model:/models:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  ollama-init:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      GENERATOR_MODEL_NAME: ${GENERATOR_MODEL_NAME:-acne-generator-v2}
      INTAKE_MODEL_NAME: ${INTAKE_MODEL_NAME:-acne-intaker}
    volumes:
      - ollama_data:/root/.ollama
      - ./model:/models:ro
      - ./docker/ollama-init.sh:/scripts/ollama-init.sh:ro
    entrypoint: ["/bin/sh", "/scripts/ollama-init.sh"]

  acne-llm:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${GENERATOR_MODEL_NAME:-acne-generator-v2}
      LLM_FALLBACK_MODEL: ""
      LLM_KEEP_ALIVE: ${LLM_KEEP_ALIVE:--1}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      LLM_NUM_PREDICT: ${LLM_NUM_PREDICT:-2048}
      LLM_USE_MODELFILE_SYSTEM: "true"
      OLLAMA_HEALTH_TIMEOUT: ${OLLAMA_HEALTH_TIMEOUT:-10}
      OLLAMA_GENERATE_TIMEOUT: ${OLLAMA_GENERATE_TIMEOUT:-300}
      INTAKE_MODEL: ${INTAKE_MODEL_NAME:-acne-intaker}
      INTAKE_TIMEOUT: ${INTAKE_TIMEOUT:-120}
      DEVICE: ${DEVICE:-cpu}
      CHROMA_DIR: /app/data/chroma_db
      BM25_PATH: /app/data/bm25_index.pkl
      SEMANTIC_ROUTER_TRAIN_PATH: /app/data/intent_classify.train.jsonl
      SEMANTIC_ROUTER_CACHE_PATH: /app/data/intent_router_index.npz
      CACHE_DIR: /app/data/cache
      AUDIT_DB_PATH: /app/data/audit.db
      SESSION_DB_PATH: /app/data/sessions.db
      HF_HOME: /app/data/model_cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/data/model_cache/sentence-transformers
      HOME: /tmp
      CORS_ORIGINS: '["*"]'
      FRONTEND_URL: http://localhost:${APP_PORT:-3000}
      API_KEY: ${API_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      METRICS_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request as u; d=json.load(u.urlopen('http://localhost:8000/api/v1/health', timeout=5)); assert d['status']=='ok' and d['ollama'] and d['bm25_loaded'] and d['kb_chunks']>0"
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 300s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      acne-llm:
        condition: service_healthy
    expose:
      - "3000"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      acne-llm:
        condition: service_healthy
    environment:
      API_KEY: ${API_KEY:-}
      NGINX_ENVSUBST_FILTER: API_KEY
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${APP_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
