<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcneLLM — Pipeline Trace</title>
<style>
:root {
  --bg: #0d0f18;
  --surface: #141720;
  --surface2: #1c2030;
  --surface3: #222840;
  --border: #2a3050;
  --accent: #5b7cf6;
  --accent2: #9b6dfa;
  --green: #2ecc71;
  --yellow: #f0c040;
  --red: #e05560;
  --orange: #f08040;
  --cyan: #30c8e0;
  --pink: #e060b0;
  --text: #dde3f0;
  --muted: #7080a0;
  --code-bg: #0a0c14;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; line-height: 1.6; }

/* ── HEADER ── */
header { background: linear-gradient(135deg, #141720, #0f1220); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; gap: 16px; }
.logo { font-size: 22px; font-weight: 800; background: linear-gradient(90deg, #5b7cf6, #9b6dfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
header p { color: var(--muted); font-size: 12px; }

/* ── TABS ── */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 24px; overflow-x: auto; }
.tab { padding: 10px 20px; font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); white-space: nowrap; transition: all 0.15s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── LAYOUT ── */
.page { display: flex; height: calc(100vh - 105px); overflow: hidden; }
.sidebar { width: 260px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 0; }
.main { flex: 1; overflow-y: auto; padding: 24px 28px; }

/* ── SIDEBAR STEPS ── */
.sidebar-step { display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; }
.sidebar-step:hover { background: var(--surface2); }
.sidebar-step.active { background: var(--surface2); border-left-color: var(--accent); }
.sidebar-step.done .step-dot { background: var(--green) !important; }
.sidebar-step.active .step-dot { box-shadow: 0 0 8px var(--accent); }
.step-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
.sidebar-step-info { flex: 1; min-width: 0; }
.sidebar-step-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-step-sub { font-size: 10px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── STEP PANEL ── */
.step-panel { display: none; }
.step-panel.active { display: block; }
.step-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
.step-subtitle { color: var(--muted); font-size: 12px; margin-bottom: 20px; font-family: monospace; }
.section { margin-bottom: 20px; }
.section-label { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

/* ── CARDS ── */
.card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
.card.highlight { border-color: var(--accent); }
.card.green { border-left: 3px solid var(--green); }
.card.yellow { border-left: 3px solid var(--yellow); }
.card.red { border-left: 3px solid var(--red); }
.card.blue { border-left: 3px solid var(--accent); }
.card.purple { border-left: 3px solid var(--accent2); }
.card.cyan { border-left: 3px solid var(--cyan); }
.card-title { font-weight: 700; font-size: 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.card-body { font-size: 12px; color: var(--muted); }

/* ── CODE ── */
pre, code { font-family: 'Cascadia Code', 'Fira Code', monospace; }
.code-block { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; font-size: 11px; overflow-x: auto; margin-bottom: 10px; line-height: 1.7; }
.code-block .k { color: #9b6dfa; }
.code-block .s { color: #2ecc71; }
.code-block .c { color: #506080; font-style: italic; }
.code-block .n { color: #5b7cf6; }
.code-block .v { color: #f0c040; }
.code-block .ok { color: #2ecc71; font-weight: 700; }
.code-block .warn { color: #f08040; }
.code-block .skip { color: #506080; }

/* ── TAGS ── */
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.tag { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.tag-green { background: #0f2a1a; color: #2ecc71; border: 1px solid #1a4a2a; }
.tag-blue { background: #0f1a35; color: #5b7cf6; border: 1px solid #1a2a50; }
.tag-purple { background: #1a0f35; color: #9b6dfa; border: 1px solid #2a1a50; }
.tag-yellow { background: #2a2010; color: #f0c040; border: 1px solid #4a3820; }
.tag-red { background: #2a0f10; color: #e05560; border: 1px solid #4a1a20; }
.tag-cyan { background: #0f2530; color: #30c8e0; border: 1px solid #1a3a50; }
.tag-gray { background: #1a1f2a; color: #7080a0; border: 1px solid #2a3040; }

/* ── INPUT BUBBLE ── */
.chat-bubble { background: var(--surface3); border: 1px solid var(--border); border-radius: 12px 12px 4px 12px; padding: 14px 18px; margin-bottom: 16px; font-size: 14px; max-width: 80%; }
.chat-bubble.user { background: #1a2050; border-color: #2a3580; margin-left: auto; border-radius: 12px 4px 12px 12px; }
.chat-bubble.bot { background: var(--surface2); }
.chat-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

/* ── FLOW ARROWS ── */
.flow-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.flow-box { background: var(--surface3); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 11px; white-space: nowrap; }
.flow-arrow { color: var(--muted); font-size: 14px; }
.flow-box.active-box { border-color: var(--accent); color: var(--accent); }
.flow-box.pass { border-color: var(--green); color: var(--green); }
.flow-box.fail { border-color: var(--red); color: var(--red); }

/* ── DECISION ── */
.decision { background: var(--surface2); border: 2px solid var(--yellow); border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
.decision-q { font-weight: 700; color: var(--yellow); margin-bottom: 6px; font-size: 12px; }
.decision-opts { display: flex; gap: 8px; flex-wrap: wrap; }
.decision-opt { padding: 4px 12px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.decision-opt.chosen { background: #1a3a1a; color: var(--green); border: 1px solid var(--green); }
.decision-opt.other { background: var(--surface3); color: var(--muted); border: 1px solid var(--border); }

/* ── SSE ── */
.sse-stream { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-family: monospace; font-size: 11px; max-height: 220px; overflow-y: auto; }
.sse-line { margin-bottom: 4px; }
.sse-line .ev { color: #9b6dfa; }
.sse-line .tok { color: #2ecc71; }
.sse-line .cit { color: #30c8e0; }
.sse-line .don { color: #f0c040; }
.sse-line .dim { color: #506080; }

/* ── NAV BUTTONS ── */
.nav-btns { display: flex; gap: 10px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
.btn { padding: 8px 20px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.btn:hover { background: var(--surface3); border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn.primary:hover { background: #4a6ae5; }

/* ── EXAMPLE PICKER ── */
.example-picker { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.ex-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 11px; cursor: pointer; transition: all 0.15s; }
.ex-btn:hover, .ex-btn.active { background: var(--surface3); color: var(--text); border-color: var(--accent); }

/* ── PROGRESS BAR ── */
.progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 20px; }
.progress-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.3s; }

/* ── KV TABLE ── */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 12px; }
.kv-key { color: var(--muted); font-family: monospace; white-space: nowrap; }
.kv-val { color: var(--text); font-family: monospace; }
.kv-val.green { color: var(--green); }
.kv-val.yellow { color: var(--yellow); }
.kv-val.red { color: var(--red); }
.kv-val.blue { color: #7090ff; }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">AcneLLM · Pipeline Trace</div>
    <p>Theo dõi từng bước xử lý từ input → output · Chọn ví dụ để thay đổi trace</p>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchExample(0)">💬 Case tư vấn mụn</div>
  <div class="tab" onclick="switchExample(1)">🔥 Mụn viêm nặng + khẩn cấp</div>
  <div class="tab" onclick="switchExample(2)">🧠 Câu hỏi kiến thức</div>
  <div class="tab" onclick="switchExample(3)">🌐 OOD → LLM Only</div>
  <div class="tab" onclick="switchExample(4)">😔 Emotional distress</div>
</div>

<div class="page">
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar"></div>

  <!-- MAIN -->
  <div class="main" id="main">
    <div id="step-panels"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════
const examples = [
{
  label: "Tư vấn mụn bọc",
  input: "Em 20 tuổi, da dầu, bị mụn bọc ở má và cằm khoảng 3 tuần nay, có viêm đỏ, đang dùng nước hoa hồng Paula's Choice BHA. Nên làm gì?",
  steps: [
    {
      id: "preprocess",
      name: "① Preprocess",
      file: "chat/preprocess.py",
      color: "#5b7cf6",
      sub: "NFC normalize",
      content: `
        <div class="section-label">Input nhận được</div>
        <div class="chat-bubble user">
          <div class="chat-label">User</div>
          Em 20 tuổi, da dầu, bị mụn bọc ở má và cằm khoảng 3 tuần nay, có viêm đỏ, đang dùng nước hoa hồng Paula's Choice BHA. Nên làm gì?
        </div>
        <div class="section-label">Xử lý</div>
        <div class="code-block">
<span class="c"># preprocess_user_text()</span>
<span class="c"># 1. NFC normalize (unicodedata.normalize)</span>
<span class="c"># 2. Strip zero-width chars (\\u200b, \\u200c, \\ufeff...)</span>
<span class="c"># 3. Collapse whitespace</span>
clean_text = <span class="s">"Em 20 tuổi, da dầu, bị mụn bọc ở má và cằm khoảng 3 tuần nay..."</span>
<span class="c"># → Không thay đổi (đã clean)</span>
        </div>
        <div class="card green">
          <div class="card-title">✓ Output</div>
          <div class="card-body">clean_text sẵn sàng cho bước tiếp theo. Không có zero-width chars, whitespace bình thường.</div>
        </div>`
    },
    {
      id: "resolve_mode",
      name: "② Resolve Mode",
      file: "chat/intake.py · _resolve_mode()",
      color: "#5b7cf6",
      sub: "auto → hybrid",
      content: `
        <div class="section-label">Logic quyết định mode</div>
        <div class="decision">
          <div class="decision-q">mode_request = "auto" → kiểm tra RAG + acne signal</div>
          <div class="decision-opts">
            <span class="decision-opt chosen">✓ RAG ready = True</span>
            <span class="decision-opt chosen">✓ acne signal trong text</span>
            <span class="decision-opt other">→ hybrid</span>
          </div>
        </div>
        <div class="code-block">
<span class="k">if</span> not c.rag_ready:
    <span class="k">return</span> <span class="s">"llm_only"</span>
<span class="k">if</span> clean_text <span class="k">and</span> not GuardrailRunner.is_acne_scope_text(clean_text):
    <span class="c"># check acne history...</span>
    <span class="k">return</span> <span class="s">"llm_only"</span>
<span class="k">return</span> <span class="ok">"hybrid"</span>  <span class="c"># ← đây</span>
        </div>
        <div class="card green"><div class="card-title">✓ mode = "hybrid"</div><div class="card-body">RAG sẵn sàng + text có từ khóa mụn → dùng hybrid retrieval</div></div>`
    },
    {
      id: "normalize",
      name: "③ Normalize",
      file: "chat/normalizer.py · 800 dòng regex",
      color: "#5b7cf6",
      sub: "Extract structured fields",
      content: `
        <div class="section-label">normalize_chat_message() — Rule-based regex extraction</div>
        <div class="code-block">
<span class="c"># Input: "Em 20 tuổi, da dầu, bị mụn bọc ở má và cằm..."</span>

age          = <span class="ok">20</span>        <span class="c"># "20 tuổi"</span>
skin_type    = <span class="ok">"oily"</span>    <span class="c"># "da dầu"</span>
lesion_types = <span class="ok">["nodule"]</span> <span class="c"># "mụn bọc" → closed comedone/nodule</span>
distribution = <span class="ok">["cheeks", "chin"]</span>  <span class="c"># "má", "cằm"</span>
inflammation = <span class="ok">"mild"</span>    <span class="c"># "viêm đỏ"</span>
duration_wks = <span class="ok">3</span>         <span class="c"># "3 tuần"</span>
products     = <span class="ok">["paula's choice bha", "nước hoa hồng"]</span>
medications  = <span class="ok">[]</span>
red_flags    = <span class="ok">[]</span>
        </div>
        <div class="card blue">
          <div class="card-title">→ UserInput (structured)</div>
          <div class="kv">
            <span class="kv-key">context.age</span><span class="kv-val green">20</span>
            <span class="kv-key">context.skin_type</span><span class="kv-val green">"oily"</span>
            <span class="kv-key">context.duration_weeks</span><span class="kv-val green">3</span>
            <span class="kv-key">clinical.lesion_types</span><span class="kv-val green">["nodule"]</span>
            <span class="kv-key">clinical.lesion_distribution</span><span class="kv-val green">["cheeks", "chin"]</span>
            <span class="kv-key">clinical.inflammation_level</span><span class="kv-val green">"mild"</span>
            <span class="kv-key">context.current_products</span><span class="kv-val green">["paula's choice bha"]</span>
          </div>
        </div>`
    },
    {
      id: "session",
      name: "④ Session History",
      file: "chat/session.py · JsonlSessionStore",
      color: "#5b7cf6",
      sub: "Load + fold history",
      content: `
        <div class="section-label">Load JSONL history</div>
        <div class="code-block">
history = store.get_history(session_id)
<span class="c"># → [] (lần đầu chat, không có history)</span>

<span class="c"># fold_history_facts() — merge prior snapshots</span>
user = fold_history_facts(base_user, history)
<span class="c"># Không có history → user giữ nguyên từ normalize()</span>

asked_fields = store.get_asked_fields(session_id)
<span class="c"># → set() (chưa hỏi field nào)</span>
        </div>
        <div class="card blue">
          <div class="card-title">Session schema mở rộng (M5/M6)</div>
          <div class="kv">
            <span class="kv-key">history turns</span><span class="kv-val">0 (turn đầu)</span>
            <span class="kv-key">asked_fields</span><span class="kv-val">set() — chưa hỏi gì</span>
            <span class="kv-key">accumulated_clinical_score</span><span class="kv-val">0.0</span>
          </div>
        </div>`
    },
    {
      id: "guardrails",
      name: "⑤ Guardrails",
      file: "guardrails/runner.py",
      color: "#e05560",
      sub: "pre_check + scope_check",
      content: `
        <div class="section-label">Pre-check — Injection + PII</div>
        <div class="code-block">
c.guardrails.pre_check(user)
<span class="c"># Kiểm tra 80+ injection patterns (EN + VI + teencode)</span>
<span class="c"># "Em 20 tuổi..." → không có injection → PASS</span>
<span class="ok">✓ pre_check PASS</span>

<span class="c"># Genital scope check (trước OOD)</span>
_is_genital_scope(clean_text) → <span class="ok">False</span>

<span class="c"># OOD scope check</span>
scope_refusal = c.guardrails.scope_check(user)
<span class="c"># keyword "mụn bọc", "da dầu" → acne scope</span>
<span class="c"># embedding similarity vs acne centroid > 0.25 → PASS</span>
scope_refusal = <span class="ok">None</span>

acne_signal = _is_acne_scope(clean_text) → <span class="ok">True</span>
scope_decision = <span class="ok">"in_scope"</span>
<span class="c"># mode giữ nguyên "hybrid" (không downgrade)</span>
        </div>
        <div class="card green"><div class="card-title">✓ Tất cả guardrail PASS</div><div class="card-body">Không injection, không OOD, acne signal detected → in_scope</div></div>`
    },
    {
      id: "intent",
      name: "⑥ Intent Router",
      file: "chat/intent_router.py",
      color: "#9b6dfa",
      sub: "advise · confidence 0.88",
      content: `
        <div class="section-label">Route flags detection (song song)</div>
        <div class="code-block">
<span class="c"># Kiểm tra tất cả flags đồng thời</span>
is_repeated_question()     → <span class="skip">False  # lần đầu</span>
language_switch            → <span class="skip">False  # VI suốt</span>
_contains_any(_EMOTIONAL)  → <span class="skip">False</span>
_contains_any(_CRISIS)     → <span class="skip">False</span>
_contains_any(_SAFETY_PRODUCT) → <span class="ok">True   # "BHA"!</span>
_contains_any(_URGENCY)    → <span class="skip">False</span>
_contains_any(_PROGRESS)   → <span class="skip">False</span>
_contains_any(_MULTI_COND) → <span class="skip">False</span>

flags = <span class="ok">["product_safety_check"]</span>

<span class="c"># Primary intent routing</span>
has_case_terms = True    <span class="c"># "em bị", "bị mụn"</span>
has_case_signal = True   <span class="c"># lesion_types populated</span>
is_advice_q = True       <span class="c"># "nên làm gì"</span>
→ primary_intent = <span class="ok">"advise"</span>, confidence = <span class="ok">0.88</span>
        </div>
        <div class="card purple">
          <div class="card-title">→ RouteDecision</div>
          <div class="kv">
            <span class="kv-key">primary_intent</span><span class="kv-val green">"advise"</span>
            <span class="kv-key">confidence</span><span class="kv-val green">0.88</span>
            <span class="kv-key">route_flags</span><span class="kv-val yellow">["product_safety_check"]</span>
            <span class="kv-key">source</span><span class="kv-val">"rule"</span>
            <span class="kv-key">classifier called?</span><span class="kv-val">No (conf ≥ 0.80)</span>
          </div>
        </div>
        <div class="tags">
          <span class="tag tag-yellow">product_safety_check → inject ingredient safety terms vào RAG</span>
        </div>`
    },
    {
      id: "completeness",
      name: "⑦ Completeness",
      file: "chat/completeness.py",
      color: "#f0c040",
      sub: "partial → advise + hỏi thêm",
      content: `
        <div class="section-label">_should_check_completeness() → True</div>
        <div class="code-block">
<span class="c"># Có case intake terms + acne signal → check</span>
_has_enough_to_answer(user):
  specific_lesions = ["nodule"]   → <span class="ok">True</span>
  <span class="c"># → đủ để tư vấn sơ bộ!</span>

missing = []
<span class="c"># lesion_types: có rồi ✓</span>
<span class="c"># distribution: có rồi (cheeks, chin) ✓</span>
<span class="c"># → không thiếu field nào</span>

→ CompletenessResult(kind=<span class="ok">"sufficient"</span>)
        </div>
        <div class="card green">
          <div class="card-title">✓ sufficient — LLM tư vấn bình thường</div>
          <div class="card-body">Có đủ: lesion_types (nodule), distribution (cheeks, chin), inflammation (mild), duration (3w), product đang dùng → không cần hỏi thêm.</div>
        </div>`
    },
    {
      id: "planner",
      name: "⑧ Clinical Planner",
      file: "llm/clinical_planner.py",
      color: "#5b7cf6",
      sub: "Build RAG queries",
      content: `
        <div class="section-label">ClinicalQueryPlanner.plan() — Rule-based, không gọi LLM</div>
        <div class="code-block">
<span class="c"># build_query_vi() — bilingual inline</span>
query_vi = <span class="s">"mụn bọc nodule má cằm cheeks chin viêm mild "</span>

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let currentExample = 0;
let currentStep = 0;

function switchExample(idx) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  currentExample = idx;
  currentStep = 0;
  render();
}

function goStep(idx) {
  const ex = examples[currentExample];
  if (idx < 0 || idx >= ex.steps.length) return;
  currentStep = idx;
  renderMain();
  renderSidebar();
  document.getElementById('main').scrollTop = 0;
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function render() {
  renderSidebar();
  renderMain();
}

function renderSidebar() {
  const ex = examples[currentExample];
  const sb = document.getElementById('sidebar');
  sb.innerHTML = `
    <div style="padding:10px 14px 6px;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;">Pipeline Steps</div>
    <div style="padding:6px 14px;margin-bottom:4px;">
      <div class="chat-bubble user" style="font-size:11px;max-width:100%;padding:8px 12px;border-radius:8px;">
        ${ex.input.substring(0,60)}${ex.input.length>60?'...':''}
      </div>
    </div>
    ${ex.steps.map((s,i) => `
      <div class="sidebar-step ${i===currentStep?'active':''} ${i<currentStep?'done':''}" onclick="goStep(${i})">
        <div class="step-dot" style="background:${i<currentStep?'var(--green)':i===currentStep?s.color:'var(--surface3)'};color:${i<=currentStep?'white':'var(--muted)'}">
          ${i<currentStep?'✓':i+1}
        </div>
        <div class="sidebar-step-info">
          <div class="sidebar-step-name">${s.name}</div>
          <div class="sidebar-step-sub">${s.sub}</div>
        </div>
      </div>
    `).join('')}
  `;
}

function renderMain() {
  const ex = examples[currentExample];
  const s = ex.steps[currentStep];
  const pct = Math.round(((currentStep+1)/ex.steps.length)*100);

  document.getElementById('step-panels').innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>

    <div class="step-title">
      <span style="color:${s.color}">${s.name}</span>
      <span style="font-size:12px;color:var(--muted);font-weight:400">${currentStep+1} / ${ex.steps.length}</span>
    </div>
    <div class="step-subtitle">${s.file}</div>

    ${s.content}

    <div class="nav-btns">
      <button class="btn" onclick="goStep(${currentStep-1})" ${currentStep===0?'disabled':''}>← Trước</button>
      <button class="btn primary" onclick="goStep(${currentStep+1})" ${currentStep===ex.steps.length-1?'disabled':''}>Tiếp →</button>
      <button class="btn" onclick="goStep(0)" style="margin-left:auto">↺ Reset</button>
    </div>
  `;
}

// init
render();
</script>
