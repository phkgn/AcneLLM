    type:'bar',

  const scopePass = Math.round((clin.scope_accuracy||0)*clin.count);

  new Chart(ctx, {
    type:'doughnut',
    data:{
      labels:['Scope Pass','Scope Fail','Safety Pass','Safety Fail'],
      datasets:[
