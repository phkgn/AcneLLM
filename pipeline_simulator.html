<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcneLLM — Pipeline Simulator</title>
<style>
  :root {
    --bg: #f7f8fc;
    --bg-alt: #eef0f7;
    --surface: #ffffff;
    --surface2: #f3f5fb;
    --surface3: #e8ecf5;
    --border: #dde1ec;
    --border-strong: #c5cbdb;
    --text: #1d2333;
    --text-soft: #3c4360;
    --muted: #6a7290;
    --muted-soft: #8a90a8;
    --accent: #2f57d6;
    --accent-soft: #eaf0ff;
    --accent2: #5b7cf7;
    --green: #1f8a5a;
    --green-soft: #e2f5ec;
    --yellow: #b87a0e;
    --yellow-soft: #fbf1dc;
    --red: #c93b3b;
    --red-soft: #fbe5e5;
    --purple: #6b46c1;
    --purple-soft: #efe9fb;
    --cyan: #1a7f93;
    --cyan-soft: #e0f3f6;
    --pink: #c2407a;
    --pink-soft: #fbe6ef;
    --orange: #c25a14;
    --orange-soft: #fbe9dc;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
    --radius: 10px;
    --shadow-sm: 0 1px 2px rgba(20,30,60,.05), 0 1px 3px rgba(20,30,60,.06);
    --shadow-md: 0 4px 12px rgba(20,30,60,.07), 0 2px 4px rgba(20,30,60,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ============== HEADER ============== */
  header.topbar {
    background: linear-gradient(135deg, #ffffff 0%, #f4f7ff 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    position: sticky; top: 0; z-index: 50;
  }
  header h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
  header h1::before {
    content: '';
    width: 26px; height: 26px;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    box-shadow: 0 2px 6px rgba(47,87,214,.3);
  }
  header .sub { font-size: 12px; color: var(--muted); margin-left: 36px; margin-top: 2px; font-weight: 500; }
  header .nav-back { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 6px; background: var(--accent-soft); transition: background .15s; }
  header .nav-back:hover { background: #d4dfff; }

  /* ============== LAYOUT ============== */
  .container {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 24px;
    padding: 24px 32px 60px;
    max-width: 1600px;
    margin: 0 auto;
  }

  /* ============== INPUT PANEL ============== */
  .input-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 100px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
  }
  .panel-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title .num {
    display: inline-flex;
    width: 22px; height: 22px;
    align-items: center; justify-content: center;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    border-radius: 6px;
  }
  textarea#userInput {
    width: 100%;
    min-height: 110px;
    padding: 12px 14px;
    font-family: var(--font);
    font-size: 13.5px;
    line-height: 1.55;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    resize: vertical;
    transition: border-color .15s, background .15s;
  }
  textarea#userInput:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(47,87,214,.1);
  }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    transition: transform .1s, box-shadow .15s, background .15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #2545b8; transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-secondary { background: var(--surface2); color: var(--text-soft); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--surface3); }
  .btn-danger { background: var(--red-soft); color: var(--red); }
  .btn-danger:hover { background: #f3c4c4; }

  .samples { margin-top: 18px; }
  .samples-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .sample-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
    font-family: var(--font);
  }
  .sample-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sample-btn-title { font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .sample-btn-meta { font-size: 11px; color: var(--muted); line-height: 1.4; }
  .sample-btn.danger:hover { background: var(--red-soft); border-color: var(--red); }
  .sample-btn.danger .sample-btn-title { color: var(--red); }
  .sample-btn.warn:hover { background: var(--yellow-soft); border-color: var(--yellow); }
  .sample-btn.pink:hover { background: var(--pink-soft); border-color: var(--pink); }

  .speed-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 12px; color: var(--muted); }
  .speed-row input[type="range"] { flex: 1; }

  /* ============== STAGES ============== */
  .stages {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .stage {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: border-color .2s, box-shadow .2s, transform .2s;
    opacity: 0.55;
  }
  .stage.active {
    opacity: 1;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(47,87,214,.1), var(--shadow-md);
  }
  .stage.done { opacity: 1; }
  .stage.refused { border-color: var(--red); }
  .stage.refused .stage-header { background: var(--red-soft); }
  .stage.warn { border-color: var(--yellow); }
  .stage.warn .stage-header { background: var(--yellow-soft); }

  .stage-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    user-select: none;
  }
  .stage.active .stage-header { background: var(--accent-soft); }

  .stage-num {
    display: inline-flex;
    width: 28px; height: 28px;
    align-items: center; justify-content: center;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .stage.refused .stage-num { background: var(--red); }
  .stage.warn .stage-num { background: var(--yellow); }
  .stage.done .stage-num { background: var(--green); }

  .stage-title { font-size: 14.5px; font-weight: 700; color: var(--text); flex: 1; }
  .stage-meta { font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
  .stage-status {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    background: var(--surface3);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .stage.active .stage-status { background: var(--accent); color: #fff; animation: pulse 1.2s infinite; }
  .stage.done .stage-status { background: var(--green); color: #fff; }
  .stage.refused .stage-status { background: var(--red); color: #fff; }
  .stage.warn .stage-status { background: var(--yellow); color: #fff; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(47,87,214,.4); }
    50% { box-shadow: 0 0 0 6px rgba(47,87,214,0); }
  }
  .stage-toggle {
    color: var(--muted);
    font-size: 11px;
    transition: transform .2s;
  }
  .stage.expanded .stage-toggle { transform: rotate(90deg); }

  .stage-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease;
  }
  .stage.expanded .stage-body { max-height: 4000px; padding: 16px; }

  .stage-section { margin-bottom: 14px; }
  .stage-section:last-child { margin-bottom: 0; }
  .stage-section-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .io-box {
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .io-box.json { color: var(--purple); }
  .io-box.code { background: #1d2333; color: #e6e9f2; border: none; padding: 14px 16px; }
  .io-box.empty { color: var(--muted); font-style: italic; }
  .io-box.success { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 600; }
  .io-box.warn { border-color: var(--yellow); background: var(--yellow-soft); color: var(--yellow); font-weight: 600; }
  .io-box.danger { border-color: var(--red); background: var(--red-soft); color: var(--red); font-weight: 600; }

  /* ============== TAGS ============== */
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    margin: 2px;
    border: 1px solid transparent;
    font-family: var(--font);
  }
  .tag-blue   { background: var(--accent-soft); color: var(--accent); border-color: #d4dfff; }
  .tag-green  { background: var(--green-soft); color: var(--green); border-color: #c6e7d7; }
  .tag-yellow { background: var(--yellow-soft); color: var(--yellow); border-color: #f0e2bc; }
  .tag-red    { background: var(--red-soft); color: var(--red); border-color: #f3c4c4; }
  .tag-purple { background: var(--purple-soft); color: var(--purple); border-color: #ddd0f0; }
  .tag-cyan   { background: var(--cyan-soft); color: var(--cyan); border-color: #c2e3e9; }
  .tag-pink   { background: var(--pink-soft); color: var(--pink); border-color: #f0c9da; }
  .tag-muted  { background: var(--surface3); color: var(--muted); border-color: var(--border); }

  /* ============== CHUNK CARDS ============== */
  .chunk-list { display: flex; flex-direction: column; gap: 8px; }
  .chunk-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12.5px;
    transition: transform .15s, box-shadow .15s;
  }
  .chunk-card:hover { transform: translateX(2px); box-shadow: var(--shadow-sm); }
  .chunk-card.guideline { border-left-color: var(--green); background: var(--green-soft); }
  .chunk-card.pubmed { border-left-color: var(--accent); background: var(--accent-soft); }
  .chunk-card.medical { border-left-color: var(--cyan); background: var(--cyan-soft); }
  .chunk-card.blog { border-left-color: var(--yellow); background: var(--yellow-soft); }
  .chunk-card.forum { border-left-color: var(--red); background: var(--red-soft); }
  .chunk-card.dropped { opacity: 0.45; text-decoration: line-through; border-left-color: var(--muted); background: var(--surface2); }

  .chunk-header { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
  .chunk-id { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .chunk-source { font-size: 11px; font-weight: 700; color: var(--text); }
  .chunk-score { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text-soft); font-weight: 600; }
  .chunk-text { font-size: 12px; color: var(--text-soft); line-height: 1.5; }

  /* ============== STREAM ============== */
  .stream-box {
    background: #1d2333;
    color: #e6e9f2;
    border-radius: 8px;
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.65;
    min-height: 80px;
    position: relative;
  }
  .stream-cursor {
    display: inline-block;
    width: 7px; height: 14px;
    background: var(--accent2);
    vertical-align: middle;
    animation: blink 0.9s infinite;
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

  /* ============== METRIC BARS ============== */
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .metric-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .metric-box-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .metric-box-value { font-size: 17px; font-weight: 800; color: var(--accent); margin-top: 3px; font-family: var(--mono); }

  /* ============== ARROW ============== */
  .arrow-down {
    text-align: center;
    color: var(--border-strong);
    font-size: 18px;
    margin: -4px 0;
    user-select: none;
  }
  .stage.active + .arrow-down,
  .stage.done + .arrow-down { color: var(--accent); }

  /* ============== TIMELINE ============== */
  .timeline-mini {
    display: flex;
    gap: 4px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .timeline-dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--surface3);
    border: 2px solid var(--border-strong);
    transition: all .2s;
  }
  .timeline-dot.done { background: var(--green); border-color: var(--green); }
  .timeline-dot.active { background: var(--accent); border-color: var(--accent); animation: pulse 1s infinite; transform: scale(1.3); }
  .timeline-dot.refused { background: var(--red); border-color: var(--red); }

  /* ============== LEGEND ============== */
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 11px; }
  .legend-item { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* ============== SCROLL ============== */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-alt); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted-soft); }

  /* mobile */
  @media (max-width: 900px) {
    .container { grid-template-columns: 1fr; padding: 16px; }
    .input-panel { position: static; max-height: none; }
  }

  /* kbd */
  kbd { font-family: var(--mono); font-size: 11px; padding: 1px 6px; background: var(--surface); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; color: var(--text-soft); }

  .hl-blue   { background: rgba(47,87,214,.18); padding: 0 2px; border-radius: 2px; color: var(--accent); font-weight: 600; }
  .hl-green  { background: rgba(31,138,90,.18); padding: 0 2px; border-radius: 2px; color: var(--green); font-weight: 600; }
  .hl-purple { background: rgba(107,70,193,.18); padding: 0 2px; border-radius: 2px; color: var(--purple); font-weight: 600; }
  .hl-pink   { background: rgba(194,64,122,.18); padding: 0 2px; border-radius: 2px; color: var(--pink); font-weight: 600; }
  .hl-red    { background: rgba(201,59,59,.18); padding: 0 2px; border-radius: 2px; color: var(--red); font-weight: 600; }
  .hl-yellow { background: rgba(184,122,14,.25); padding: 0 2px; border-radius: 2px; color: var(--yellow); font-weight: 600; }
  .hl-cyan   { background: rgba(26,127,147,.18); padding: 0 2px; border-radius: 2px; color: var(--cyan); font-weight: 600; }
</style>
</head>
<body>

<header class="topbar">
  <div>
    <h1>AcneLLM Pipeline Simulator</h1>
    <div class="sub">Mô phỏng từng bước biến đổi của input · 10 stages · Real-time</div>
  </div>
  <a href="wiki.html" class="nav-back">← Wiki</a>
</header>

<div class="container">

  <!-- ============== INPUT PANEL ============== -->
  <aside class="input-panel">
    <div class="panel-title"><span class="num">✎</span>Input</div>
    <textarea id="userInput" placeholder="Nhập câu hỏi của user...&#10;&#10;Ví dụ: Em 22 tuổi, đang mang thai 3 tháng, bị mụn viêm 2 năm ở cằm, định dùng tretinoin có sao không?"></textarea>

    <div class="btn-row">
      <button class="btn btn-primary" id="runBtn">▶ Chạy pipeline</button>
      <button class="btn btn-secondary" id="stepBtn">⏭ Step</button>
      <button class="btn btn-danger" id="resetBtn">↺ Reset</button>
    </div>

    <div class="speed-row">
      <span>⚡ Speed:</span>
      <input type="range" id="speedRange" min="100" max="1500" value="500" step="100">
      <span id="speedLabel" style="font-family:var(--mono);width:50px;text-align:right">500ms</span>
    </div>

    <div class="samples">
      <div class="samples-title">📋 Sample inputs</div>
      <button class="sample-btn" data-sample="basic">
        <div class="sample-btn-title">Case viêm cơ bản</div>
        <div class="sample-btn-meta">Nữ 22t, mụn viêm 6 tháng, đang dùng BHA</div>
      </button>
      <button class="sample-btn pink" data-sample="pregnant">
        <div class="sample-btn-title">⚠️ Mang thai + retinoid</div>
        <div class="sample-btn-meta">Trigger safety suffix tretinoin</div>
      </button>
      <button class="sample-btn warn" data-sample="severe">
        <div class="sample-btn-title">🚨 Severe + scarring</div>
        <div class="sample-btn-meta">Trigger urgency red flag</div>
      </button>
      <button class="sample-btn" data-sample="knowledge">
        <div class="sample-btn-title">❓ Knowledge question</div>
        <div class="sample-btn-meta">"Tretinoin là gì?" — skip completeness</div>
      </button>
      <button class="sample-btn danger" data-sample="genital">
        <div class="sample-btn-title">🔒 Genital scope (refuse)</div>
        <div class="sample-btn-meta">Hard refuse trước OOD check</div>
      </button>
      <button class="sample-btn danger" data-sample="ood">
        <div class="sample-btn-title">🧭 OOD (refuse)</div>
        <div class="sample-btn-meta">"Cách nấu phở" — out of scope</div>
      </button>
      <button class="sample-btn danger" data-sample="injection">
        <div class="sample-btn-title">🚫 Prompt injection</div>
        <div class="sample-btn-meta">"Ignore previous instructions..."</div>
      </button>
      <button class="sample-btn" data-sample="teen">
        <div class="sample-btn-title">👶 Tuổi &lt; 12</div>
        <div class="sample-btn-meta">Trigger nhi khoa suffix</div>
      </button>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span>Guideline</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span>PubMed</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--cyan)"></span>Medical site</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--yellow)"></span>Blog</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--red)"></span>Forum</div>
    </div>

    <div class="timeline-mini" id="timelineMini"></div>
  </aside>

  <!-- ============== STAGES ============== -->
  <div class="stages" id="stages">
    <!-- stages populated by JS -->
  </div>

</div>

<script>
// ============================================================
// MOCK KNOWLEDGE BASE (simulated chunks)
// ============================================================

// --- Stage 1: Preprocess ---
function preprocess(text) {
  const original = text;
  // NFC normalize
  let out = text.normalize('NFC');
  // remove zero-width chars
  out = out.replace(/[​-‍﻿]/g, '');
  // remove control chars except newline/tab
  out = out.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
  // collapse multiple whitespace
  out = out.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  return { original, normalized: out, changed: original !== out };
}

// --- Stage 2: Normalize / Extract ---
function extractFields(text) {
  const lower = text.toLowerCase();
  const result = {
    age: null, sex: null, skin_type: null,
    lesion_types: [], distribution: [],
    inflammation_level: null, duration_weeks: null,
    medications: [], current_products: [],
    hormonal_factors: [], allergies: [], red_flags: [],
    is_pregnant: null,
  };

  // Age
  const ageMatch = lower.match(/\b(\d{1,2})\s*(?:tuổi|tuoi|t\b(?!\s*(?:nay|rồi|qua|trước|truoc)))/);
  if (ageMatch) result.age = parseInt(ageMatch[1]);

  // Sex
  if (/\b(nữ|nu|chị|chi|em gái|con gái|cô)\b/.test(lower)) result.sex = 'female';
  else if (/\b(nam|anh|con trai|chú)\b/.test(lower)) result.sex = 'male';

  // Skin type
  if (/da dầu|da nhờn|oily/.test(lower)) result.skin_type = 'oily';
  else if (/da khô|da kho|dry/.test(lower)) result.skin_type = 'dry';
  else if (/da hỗn hợp|hon hop|combination/.test(lower)) result.skin_type = 'combination';
  else if (/da nhạy cảm|nhay cam|sensitive/.test(lower)) result.skin_type = 'sensitive';

  // Lesions
  const lesionMap = [
    [/mụn viêm|sưng đỏ|papule/, 'papule'],
    [/mụn mủ|pustule/, 'pustule'],
    [/mụn đầu đen|comedone đen|blackhead/, 'blackhead'],
    [/mụn đầu trắng|whitehead|comedone trắng/, 'whitehead'],
    [/mụn bọc|nốt|nodule/, 'nodule'],
    [/mụn nang|cyst/, 'cyst'],
    [/thâm|tăng sắc tố|hyperpigment/, 'hyperpigmentation'],
    [/sẹo|sẹo rỗ|scar/, 'scar'],
  ];
  lesionMap.forEach(([re, name]) => { if (re.test(lower)) result.lesion_types.push(name); });

  // Distribution
  const distMap = [
    [/cằm|chin|jawline/, 'chin'],
    [/má|cheek/, 'cheek'],
    [/trán|forehead/, 'forehead'],
    [/mũi|nose/, 'nose'],
    [/lưng|back/, 'back'],
    [/ngực|chest/, 'chest'],
    [/vai|shoulder/, 'shoulder'],
  ];
  distMap.forEach(([re, name]) => { if (re.test(lower)) result.distribution.push(name); });

  // Inflammation
  if (/nặng|nang|nhiều mụn|severe|sưng to/.test(lower)) result.inflammation_level = 'severe';
  else if (/vừa|moderate|nhiều cái/.test(lower)) result.inflammation_level = 'moderate';
  else if (/nhẹ|mild|ít|vài cái/.test(lower)) result.inflammation_level = 'mild';

  // Duration
  const durM = lower.match(/(\d+)\s*(năm|nam|year|tháng|thang|month|tuần|tuan|week)/);
  if (durM) {
    const n = parseInt(durM[1]);
    const u = durM[2];
    if (/năm|nam|year/.test(u)) result.duration_weeks = n * 52;
    else if (/tháng|thang|month/.test(u)) result.duration_weeks = n * 4;
    else result.duration_weeks = n;
  }

  // Medications (with use-context)
  const medList = ['tretinoin', 'adapalene', 'isotretinoin', 'spironolactone', 'doxycycline', 'azithromycin', 'erythromycin'];
  medList.forEach(m => {
    if (lower.includes(m)) {
      // check if it's "đang dùng" or "có nên dùng"
      const hasUseContext = /(đang dùng|đang uống|đã dùng|sử dụng)\s+\w{0,20}\s*/.test(lower);
      result.medications.push(m + (hasUseContext ? '' : '?'));
    }
  });

  // Products (light)
  const prodList = ['bha', 'aha', 'niacinamide', 'salicylic', 'benzoyl', 'azelaic', 'retinol', 'vitamin c'];
  prodList.forEach(p => { if (lower.includes(p)) result.current_products.push(p); });

  // Hormonal
  if (/mang thai|thai|pregnant|bầu/.test(lower)) { result.hormonal_factors.push('pregnancy'); result.is_pregnant = true; }
  if (/cho con bú|cho bu|breastfeed/.test(lower)) result.hormonal_factors.push('breastfeeding');
  if (/kinh nguyệt|chu kỳ|menstrual/.test(lower)) result.hormonal_factors.push('menstrual_cycle');
  if (/pcos|buồng trứng đa nang/.test(lower)) result.hormonal_factors.push('pcos');
  if (/stress|căng thẳng|cang thang/.test(lower)) result.hormonal_factors.push('stress');

  // Red flags
  if (/sẹo|scar|rỗ/.test(lower)) result.red_flags.push('scarring_risk');
  if (/lan rộng|widespread|nhiều vùng/.test(lower)) result.red_flags.push('widespread');
  if (/đau|painful|nhức/.test(lower)) result.red_flags.push('painful_lesions');
  if (/mủ|purulent|nhiễm trùng/.test(lower)) result.red_flags.push('purulent_lesions');

  return result;
}

// --- Stage 4a: Injection detection ---
const INJECTION_PATTERNS = [
  /ignore (previous|above|all) (instructions|rules|prompts)/i,
  /bỏ qua (chỉ thị|hướng dẫn|quy tắc)/i,
  /forget everything/i,
  /\[system\]/i, /<\|system\|>/i, /<\|user\|>/i, /<\|assistant\|>/i,
  /you are now/i, /act as/i,
  /jailbreak|DAN mode/i,
  /reveal (your|the) (prompt|system)/i,
];
function detectInjection(text) {
  return INJECTION_PATTERNS.filter(p => p.test(text)).map(p => p.source);
}

// --- Stage 4b: Genital scope ---
const GENITAL_PATTERNS = [/vùng kín|vung kin|sinh dục|sinh duc|hậu môn|hau mon|cô bé|cậu bé|cô nhỏ/i, /\bgenital|anal|vulva|penis|vagina\b/i];
function detectGenital(text) { return GENITAL_PATTERNS.some(p => p.test(text)); }

// --- Stage 4c: OOD scope (acne keyword + complement) ---
const ACNE_KEYWORDS = ['mụn', 'mun', 'acne', 'da', 'skin', 'tretinoin', 'retinoid', 'bha', 'aha', 'benzoyl', 'salicylic', 'isotretinoin', 'sẹo', 'thâm', 'comedone', 'papule', 'pustule', 'nodule', 'cyst', 'cằm', 'má', 'trán', 'lưng', 'pcos', 'kinh nguyệt', 'mang thai', 'da dầu', 'da khô'];
const OOD_KEYWORDS = ['phở', 'cơm', 'nấu ăn', 'recipe', 'lập trình', 'code', 'python', 'football', 'bóng đá', 'stock', 'chứng khoán', 'tỷ giá', 'crypto', 'bitcoin'];
function scopeCheck(text) {
  const lower = text.toLowerCase();
  const acneHits = ACNE_KEYWORDS.filter(k => lower.includes(k));
  const oodHits = OOD_KEYWORDS.filter(k => lower.includes(k));
  const score = acneHits.length - oodHits.length * 2;
  return { acneHits, oodHits, score, inScope: score > 0 || acneHits.length >= 1 };
}

// --- Stage 5: Clinical Query Plan ---
function buildPlan(fields, text) {
  const queries_vi = [], queries_en = [];
  const intent = fields.medications.length ? 'product_safety' :
                 fields.red_flags.includes('scarring_risk') || fields.inflammation_level === 'severe' ? 'urgency' :
                 fields.lesion_types.length || fields.is_pregnant ? 'treatment' : 'general';

  // Build queries from extracted signals
  if (fields.is_pregnant && fields.medications.some(m => m.startsWith('tretinoin') || m.startsWith('adapalene') || m.startsWith('isotretinoin'))) {
    queries_vi.push('tretinoin mang thai có an toàn không');
    queries_en.push('tretinoin retinoid safety in pregnancy');
  }
  if (fields.lesion_types.includes('papule') || fields.lesion_types.includes('pustule')) {
    queries_vi.push('điều trị mụn viêm ' + (fields.sex === 'female' ? 'nữ' : ''));
    queries_en.push('inflammatory acne treatment');
  }
  if (fields.distribution.includes('chin')) {
    queries_vi.push('mụn vùng cằm nội tiết');
    queries_en.push('hormonal jawline acne');
  }
  if (fields.inflammation_level === 'severe' || fields.red_flags.includes('scarring_risk')) {
    queries_vi.push('mụn nặng sẹo isotretinoin');
    queries_en.push('severe acne scarring isotretinoin');
  }
  if (fields.age && fields.age < 12) {
    queries_vi.push('mụn trẻ em dưới 12 tuổi');
    queries_en.push('pediatric acne children');
  }
  // Fallback: dùng raw text
  if (queries_vi.length === 0) queries_vi.push(text.substring(0, 80));

  const priority = (fields.is_pregnant || fields.inflammation_level === 'severe') ? ['nice_guideline', 'aad_guideline'] : [];

  return { queries_vi, queries_en, bilingual: true, intent, priority_source_types: priority };
}

// --- Stage 6: Retrieval (mock hybrid) ---
function mockRetrieve(plan) {
  // Score each chunk: keyword overlap + boost
  const allQueries = [...plan.queries_vi, ...plan.queries_en].join(' ').toLowerCase();
  const queryTokens = allQueries.split(/\s+/).filter(t => t.length > 2);

  const dense = []; // simulated dense ranking
  const sparse = []; // simulated BM25 ranking

  MOCK_KB.forEach(chunk => {
    const text = (chunk.text + ' ' + chunk.keywords.join(' ')).toLowerCase();
    let kwScore = 0;
    chunk.keywords.forEach(k => {
      if (queryTokens.some(q => k.toLowerCase().includes(q) || q.includes(k.toLowerCase()))) kwScore += 1;
    });
    let denseScore = kwScore * 0.3 + Math.random() * 0.2;
    let sparseScore = kwScore * 0.25 + Math.random() * 0.15;
    dense.push({ chunk, score: denseScore });
    sparse.push({ chunk, score: sparseScore });
  });
  dense.sort((a, b) => b.score - a.score);
  sparse.sort((a, b) => b.score - a.score);

  // RRF k=60
  const k = 60;
  const fused = {};
  dense.forEach((item, i) => {
    fused[item.chunk.id] = (fused[item.chunk.id] || { chunk: item.chunk, score: 0 });
    fused[item.chunk.id].score += 1 / (k + i + 1);
  });
  sparse.forEach((item, i) => {
    fused[item.chunk.id] = (fused[item.chunk.id] || { chunk: item.chunk, score: 0 });
    fused[item.chunk.id].score += 1 / (k + i + 1);
  });

  // Trust boost
  const boosted = Object.values(fused).map(it => ({ ...it, scoreBoosted: it.score * it.chunk.boost }));
  boosted.sort((a, b) => b.scoreBoosted - a.scoreBoosted);

  // Priority filter (if guideline priority) — bump guideline to front
  if (plan.priority_source_types.length > 0) {
    boosted.sort((a, b) => {
      const aP = plan.priority_source_types.includes(a.chunk.type) ? 1 : 0;
      const bP = plan.priority_source_types.includes(b.chunk.type) ? 1 : 0;
      if (aP !== bP) return bP - aP;
      return b.scoreBoosted - a.scoreBoosted;
    });
  }

  return {
    dense: dense.slice(0, 5),
    sparse: sparse.slice(0, 5),
    fused: boosted.slice(0, 10),
  };
}

// --- Stage 7: Rerank (mock cross-encoder) ---
function mockRerank(pool, query) {
  // Simulate cross-encoder: prioritize keyword + length match
  const lower = query.toLowerCase();
  const reranked = pool.map(it => {
    const t = it.chunk.text.toLowerCase();
    let crossScore = 0;
    it.chunk.keywords.forEach(k => { if (lower.includes(k.toLowerCase())) crossScore += 0.15; });
    if (it.chunk.cls === 'guideline') crossScore += 0.2;
    if (it.chunk.cls === 'pubmed') crossScore += 0.1;
    if (it.chunk.cls === 'forum') crossScore -= 0.2;
    const sigmoid = 1 / (1 + Math.exp(-(crossScore + Math.random() * 0.3)));
    return { ...it, sigmoid };
  });
  reranked.sort((a, b) => b.sigmoid - a.sigmoid);
  const top3 = reranked.slice(0, 3);
  const dropped = reranked.slice(3);
  // Mark < 0.30 as dropped (drop_noisy)
  return { top3: top3.filter(it => it.sigmoid >= 0.3), dropped: [...dropped, ...top3.filter(it => it.sigmoid < 0.3)] };
}

// --- Stage 8: Prompt build ---
function buildPrompt(fields, text, chunks) {
  let context = '';
  chunks.forEach((it, i) => {
    const badge = it.chunk.type === 'nice_guideline' ? '[NICE]' :
                  it.chunk.type === 'aad_guideline' ? '[AAD]' :
                  it.chunk.type === 'pubmed_review' || it.chunk.type === 'jid_paper' ? '[PubMed]' :
                  it.chunk.type === 'en_medical_site' ? '[Medical]' :
                  it.chunk.type === 'blog' ? '[Blog]' : '[Forum]';
    context += `${badge} (chunk ${it.chunk.id})\n${it.chunk.text}\n\n`;
  });
  // Sanitize: escape injection markers
  const safeText = text.replace(/\[system\]/gi, '\\[system\\]').replace(/<\|/g, '&lt;|');
  const userBlock = `THÔNG TIN NGƯỜI DÙNG:
- Tuổi: ${fields.age || 'không rõ'}
- Giới: ${fields.sex || 'không rõ'}
- Loại da: ${fields.skin_type || 'không rõ'}
- Loại mụn: ${fields.lesion_types.join(', ') || 'không rõ'}
- Vị trí: ${fields.distribution.join(', ') || 'không rõ'}
- Mức viêm: ${fields.inflammation_level || 'không rõ'}
- Mang thai: ${fields.is_pregnant ? 'CÓ' : 'không'}

${fields.red_flags.length ? '- ⚠️ Red flags: ' + fields.red_flags.join(', ') : ''}

NGỮ CẢNH (từ KB - chỉ dùng thông tin này):
${context}
Trả lời ngắn gọn, tiếng Việt, không bịa thông tin ngoài context.`;
  return userBlock;
}

// --- Stage 9: Mock LLM stream ---
function mockLLMResponse(fields, chunks, text) {
  let resp = '';
  if (fields.is_pregnant && (fields.medications.some(m => /tretinoin|adapalene|isotretinoin/.test(m)) || /tretinoin|retinoid/i.test(text))) {
    resp = `Chào bạn,\n\nTretinoin (và các retinoid khác) **chống chỉ định tuyệt đối trong thai kỳ** do nguy cơ gây dị tật bẩm sinh nghiêm trọng (NICE NG198, AAD). Bạn cần ngưng tretinoin ngay.\n\nLựa chọn an toàn hơn cho da mụn khi mang thai:\n- Azelaic acid 15-20% (category B)\n- Erythromycin topical\n- Vệ sinh nhẹ nhàng, tránh scrub`;
  } else if (fields.inflammation_level === 'severe' || fields.red_flags.includes('scarring_risk')) {
    resp = `Chào bạn, tình trạng có dấu hiệu nặng + nguy cơ sẹo. Khuyến cáo:\n\n1. **Khám bác sĩ da liễu sớm** để cân nhắc isotretinoin oral (theo AAD/NICE).\n2. Tránh nặn, scrub mạnh.\n3. Trong khi chờ khám: BHA 2% + benzoyl peroxide 2.5%, dưỡng ẩm dịu nhẹ.`;
  } else if (fields.age && fields.age < 12) {
    resp = `Chào bạn,\n\nỞ độ tuổi dưới 12, mụn nên được **bác sĩ chuyên khoa nhi/da liễu nhi** thăm khám. Tránh tự ý dùng retinoid hoặc kháng sinh hệ thống. Vệ sinh nhẹ với sữa rửa mặt dịu nhẹ là đủ cho đa số trường hợp.`;
  } else if (/là gì|tại sao|cơ chế|definition/i.test(text)) {
    resp = `Theo các tài liệu y khoa (WebMD, PubMed), ${chunks[0]?.chunk.text.split('.')[0] || 'thông tin về chủ đề bạn hỏi'}.\n\nNếu bạn muốn tư vấn cụ thể cho tình trạng da của mình, hãy mô tả thêm về loại mụn, vị trí, và sản phẩm đang dùng nhé.`;
  } else {
    const chunkRef = chunks.length ? chunks[0].chunk.source : 'tài liệu y khoa';
    resp = `Chào bạn,\n\nVới mô tả của bạn (${fields.lesion_types.join(', ') || 'mụn'}${fields.distribution.length ? ' ở ' + fields.distribution.join(', ') : ''}), theo ${chunkRef}:\n\n- Có thể dùng BHA 2% (salicylic acid) buổi sáng để giảm bít tắc\n- Buổi tối: adapalene 0.1% hoặc benzoyl peroxide 2.5%\n- Dưỡng ẩm dịu nhẹ, tránh scrub, không tự nặn\n\nNếu sau 8-12 tuần không cải thiện, nên đi khám bác sĩ da liễu.`;
  }
  return resp;
}

// --- Stage 10: Safety suffix ---
function getSafetySuffix(fields, response) {
  const suffixes = [];
  if (fields.is_pregnant && /tretinoin|adapalene|isotretinoin|retinoid/i.test(response)) {
    suffixes.push({ type: 'critical', text: '⚠️ Tretinoin/Isotretinoin CHỐNG CHỈ ĐỊNH khi mang thai. Hãy gặp bác sĩ ngay.' });
  }
  if (/isotretinoin|spironolactone|doxycycline/i.test(response)) {
    suffixes.push({ type: 'rx', text: '💊 Các thuốc này cần đơn bác sĩ, không tự ý dùng.' });
  }
  if (fields.age && fields.age < 12) {
    suffixes.push({ type: 'pediatric', text: '👶 Bạn dưới 12 tuổi nên thăm khám chuyên khoa nhi/da liễu.' });
  }
  if (fields.inflammation_level === 'severe' && fields.red_flags.includes('scarring_risk')) {
    suffixes.push({ type: 'urgent', text: '🚨 Tình trạng có dấu hiệu nặng và nguy cơ sẹo — vui lòng đến cơ sở y tế sớm.' });
  }
  return suffixes;
}

  // Highlight extracted terms in original text

      <div class="stage-section-label">🔮 Model</div>
      <div>
        <span class="tag tag-purple">qwen2.5:7b</span>
        <span class="tag tag-muted">num_ctx=8192</span>
        <span class="tag tag-muted">temp=0.4</span>
        <span class="tag tag-muted">stream=true</span>
      </div>
    </div>
    <div class="stage-section">
      <div class="stage-section-label">💬 Token stream (SSE)</div>
      <div class="stream-box" id="streamOutput"><span class="stream-cursor"></span></div>
    </div>
    <div class="stage-section">
      <div class="stage-section-label">📡 SSE events emitted</div>
      <div id="sseEvents"></div>
    </div>
  `);

  const tokens = llmResp.split(/(\s+)/);
  const streamEl = document.getElementById('streamOutput');
  const sseEl = document.getElementById('sseEvents');
  const tokenDelay = Math.max(20, getDelay() / 20);
  for (let i = 0; i < tokens.length; i++) {
    streamed += tokens[i];
    streamEl.innerHTML = escapeHtml(streamed).replace(/\n/g, '<br>') + '<span class="stream-cursor"></span>';
    await sleep(tokenDelay);
  }
  // emit citation events
  rerank.top3.forEach((c, i) => {
    sseEl.innerHTML += `<div class="io-box" style="margin-bottom:4px;font-size:11.5px"><span class="tag tag-cyan">event: citation</span> data: {chunk_id:"${c.chunk.id}", source:"${c.chunk.source}", type:"${c.chunk.type}"}</div>`;
  });
  sseEl.innerHTML += `<div class="io-box success" style="margin-top:4px;font-size:11.5px"><span class="tag tag-green">event: done</span> data: {mode:"hybrid", latency_ms:${1800 + Math.floor(Math.random() * 1200)}, evidence_quality:"${rerank.top3.some(c => c.chunk.cls === 'guideline') ? 'guideline' : 'web'}"}</div>`;
  streamEl.innerHTML = escapeHtml(streamed).replace(/\n/g, '<br>');
  setStatus(9, 'done', `${tokens.length} tokens`);

  // --- Stage 10: Safety suffix + persist ---
  setStatus(10, 'active', 'finalizing');
  await sleep(getDelay());
  const suffixes = getSafetySuffix(fields, llmResp);
  const final = llmResp + (suffixes.length ? '\n\n' + suffixes.map(s => s.text).join('\n') : '');

  renderBody(10, `
    <div class="stage-section">
      <div class="stage-section-label">⚠️ Safety suffix triggers</div>
      ${suffixes.length === 0 ? '<div class="io-box success">✓ Không cần suffix</div>' :
        suffixes.map(s => `<div class="io-box ${s.type === 'critical' || s.type === 'urgent' ? 'danger' : 'warn'}" style="margin-bottom:6px">${s.text}</div>`).join('')}
    </div>
    <div class="stage-section">
      <div class="stage-section-label">📤 Final response (user nhận)</div>
      <div class="stream-box">${escapeHtml(final).replace(/\n/g, '<br>')}</div>
    </div>
    <div class="stage-section">
      <div class="stage-section-label">💾 Persist</div>
      <div class="io-box">
        ✓ SessionStore.append_turn() → <code>data/sessions/&lt;sid&gt;.jsonl</code> (atomic)<br>
        ✓ AuditStore.log() → <code>data/audit.db</code> bảng <code>audit_log</code><br>
        ✓ MetricsRegistry.observe() → Prometheus
      </div>
    </div>
    <div class="stage-section">
      <div class="stage-section-label">🎉 Done event payload</div>
      <div class="io-box json">${escapeHtml(JSON.stringify({
        mode: 'hybrid',
        latency_ms: 1800 + Math.floor(Math.random() * 1200),
        used_chunks: rerank.top3.length,
        session_id: 'sim-' + Math.random().toString(36).substring(2, 10),
        evidence_quality: rerank.top3.some(c => c.chunk.cls === 'guideline') ? 'guideline' : rerank.top3.some(c => c.chunk.cls === 'pubmed') ? 'journal' : 'web',
      }, null, 2))}</div>
    </div>
  `);
  setStatus(10, suffixes.some(s => s.type === 'critical' || s.type === 'urgent') ? 'warn' : 'done', suffixes.length ? `${suffixes.length} warning(s)` : 'done');

  running = false;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function exportResults() {
  const results = {
    timestamp: new Date().toISOString(),
    input: document.getElementById('userInput').value,
    stages: []
  };

  document.querySelectorAll('.stage-card').forEach((card, idx) => {
    const status = card.querySelector('.stage-status');
    const content = card.querySelector('.stage-content');
    results.stages.push({
      stage: idx + 1,
      name: card.querySelector('.stage-title').textContent,
      status: status ? status.textContent : 'pending',
      content: content ? content.innerHTML : ''
    });
  });

  const blob = new Blob([JSON.stringify(results, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `acnellm-pipeline-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
