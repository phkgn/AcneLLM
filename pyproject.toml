[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acne-llm"
version = "0.1.0"
description = "Hệ thống tư vấn da mụn tiếng Việt — local RAG + LLM"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# research/ chua cac package offline (datagen, evaluation, LLMData).
# Chung import cheo nhau bang ten tuyet doi ("from datagen.x import y") nen
# duong dan file khong khop ten module -- co y, xem docs/CLEANUP_PLAN.md muc 3.
pythonpath = ["src", "research"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
